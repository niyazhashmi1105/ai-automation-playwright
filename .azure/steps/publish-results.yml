# Publish JUnit to the Tests tab and the blob report for the merge job.
parameters:
  - name: name
    type: string

steps:
  - task: PublishTestResults@2
    displayName: Publish JUnit (${{ parameters.name }})
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: junit/results.xml
      testRunTitle: Playwright ${{ parameters.name }}
      mergeTestResults: true
      failTaskOnMissingResultsFile: false
  - task: PublishPipelineArtifact@1
    displayName: Publish blob report (${{ parameters.name }})
    condition: succeededOrFailed()
    inputs:
      targetPath: blob-report
      artifact: blob-report-${{ parameters.name }}
